name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libsdl2-dev libsdl2-image-dev

      - name: Build
        run: |
          make clean release

      - name: Package
        run: |
          mkdir -p raycaster-linux
          cp game raycaster-linux/
          cp -r assets raycaster-linux/
          cp README.md LICENSE raycaster-linux/ 2>/dev/null || true
          # Remove non-essential assets to reduce package size
          rm -f raycaster-linux/assets/*.gif raycaster-linux/assets/*.jpg
          tar czf raycaster-linux-x86_64.tar.gz raycaster-linux

      - uses: actions/upload-artifact@v4
        with:
          name: raycaster-linux-x86_64
          path: raycaster-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2 sdl2_image pkg-config dylibbundler

      - name: Build
        run: |
          make clean release

      - name: Package
        run: |
          mkdir -p raycaster-macos
          cp game raycaster-macos/
          cp -r assets raycaster-macos/
          cp README.md LICENSE raycaster-macos/ 2>/dev/null || true
          rm -f raycaster-macos/assets/*.gif raycaster-macos/assets/*.jpg
          dylibbundler -od -b \
            -x raycaster-macos/game \
            -d raycaster-macos/lib \
            -p @executable_path/lib/
          find raycaster-macos/lib -type f -name '*.dylib' \
            -exec codesign --force --sign - {} \;
          codesign --force --sign - raycaster-macos/game
          codesign --verify --deep --strict raycaster-macos/game
          (
            cd /tmp
            SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software \
              "$GITHUB_WORKSPACE/raycaster-macos/game" --smoke-test
          )
          ARCH=$(uname -m)
          tar czf "raycaster-macos-${ARCH}.tar.gz" raycaster-macos

      - uses: actions/upload-artifact@v4
        with:
          name: raycaster-macos
          path: raycaster-macos-*.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-pkg-config
            make
            zip

      - name: Build
        run: |
          make clean release
          ls -la game*

      - name: Package
        run: |
          mkdir -p raycaster-windows
          # On MSYS2/MinGW the binary is 'game.exe'
          if [ -f game.exe ]; then
            cp game.exe raycaster-windows/raycaster.exe
          else
            cp game raycaster-windows/raycaster.exe
          fi
          cp -r assets raycaster-windows/
          cp README.md LICENSE raycaster-windows/ 2>/dev/null || true
          rm -f raycaster-windows/assets/*.gif raycaster-windows/assets/*.jpg
          # Bundle required MinGW DLLs
          ldd raycaster-windows/raycaster.exe | grep '/mingw64/' | awk '{print $3}' | while read dll; do
            cp "$dll" raycaster-windows/ 2>/dev/null || true
          done
          ls -la raycaster-windows/

      - name: Create zip
        run: |
          cd raycaster-windows && zip -r ../raycaster-windows-x86_64.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: raycaster-windows-x86_64
          path: raycaster-windows-x86_64.zip

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            raycaster-linux-x86_64.tar.gz
            raycaster-macos-*.tar.gz
            raycaster-windows-x86_64.zip
