name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libsdl2-dev libsdl2-image-dev

      - name: Build
        run: |
          make clean release

      - name: Package
        run: |
          mkdir -p raycaster-linux
          cp game raycaster-linux/
          cp -r assets raycaster-linux/
          cp README.md LICENSE raycaster-linux/ 2>/dev/null || true
          # Remove non-essential assets to reduce package size
          rm -f raycaster-linux/assets/*.gif raycaster-linux/assets/*.jpg
          tar czf raycaster-linux-x86_64.tar.gz raycaster-linux

      - uses: actions/upload-artifact@v4
        with:
          name: raycaster-linux-x86_64
          path: raycaster-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2 sdl2_image pkg-config

      - name: Build
        run: |
          make clean release

      - name: Package
        run: |
          mkdir -p raycaster-macos
          cp game raycaster-macos/
          cp -r assets raycaster-macos/
          cp README.md LICENSE raycaster-macos/ 2>/dev/null || true
          rm -f raycaster-macos/assets/*.gif raycaster-macos/assets/*.jpg
          tar czf raycaster-macos-arm64.tar.gz raycaster-macos

      - uses: actions/upload-artifact@v4
        with:
          name: raycaster-macos-arm64
          path: raycaster-macos-arm64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-pkg-config
            make

      - name: Build
        run: |
          make clean release

      - name: Package
        run: |
          mkdir -p raycaster-windows
          cp game.exe raycaster-windows/ 2>/dev/null || cp game raycaster-windows/raycaster.exe
          cp -r assets raycaster-windows/
          cp README.md LICENSE raycaster-windows/ 2>/dev/null || true
          rm -f raycaster-windows/assets/*.gif raycaster-windows/assets/*.jpg
          # Bundle required DLLs
          ldd raycaster-windows/raycaster.exe 2>/dev/null | grep mingw | awk '{print $3}' | while read dll; do
            cp "$dll" raycaster-windows/ 2>/dev/null || true
          done
          # Also grab common SDL2 DLLs from known paths
          for dll in SDL2.dll SDL2_image.dll libpng16-16.dll zlib1.dll libjpeg-8.dll libtiff-6.dll libwebp-7.dll; do
            find /mingw64/bin -name "$dll" -exec cp {} raycaster-windows/ \; 2>/dev/null || true
          done

      - name: Create zip
        run: |
          cd raycaster-windows && 7z a -tzip ../raycaster-windows-x86_64.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: raycaster-windows-x86_64
          path: raycaster-windows-x86_64.zip

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            raycaster-linux-x86_64.tar.gz
            raycaster-macos-arm64.tar.gz
            raycaster-windows-x86_64.zip
