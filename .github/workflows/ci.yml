name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDL development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-image-dev

      - name: Build release
        run: make --jobs=2 release

      - name: Build debug with sanitizers
        run: make --jobs=2 debug

      - name: Headless release smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: ./game --smoke-test

      - name: Headless sanitizer smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: ./build/debug/game --smoke-test
